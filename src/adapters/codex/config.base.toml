approval_policy = "never"
sandbox_mode = "workspace-write"

[features]
hooks = true
default_mode_request_user_input = true

[sandbox_workspace_write]
network_access = true
writable_roots = ["{{HOME}}/Dev/Configuration/Agents", "{{HOME}}/Dev/Configuration/zsh", "{{HOME}}/Dev/Repositories/Packages/dev-tools", "{{HOME}}/.Trash", "{{HOME}}/.cache", "{{HOME}}/.agents", "/tmp", "/private/tmp"]

[tui]
status_line = ["run-state", "project-name", "used-tokens", "context-used", "five-hour-limit", "weekly-limit", "model-with-reasoning"]
status_line_use_colors = true
alternate_screen = "never"

[mcp_servers.codebase-memory-mcp]
startup_timeout_sec = 60
required = true
command = "codebase-memory-mcp"
default_tools_approval_mode = "approve"

[mcp_servers.serena]
startup_timeout_sec = 60
required = true
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
default_tools_approval_mode = "approve"

[mcp_servers.mdn]
url = "https://mcp.mdn.mozilla.net/"
enabled = false

[mcp_servers.sketch]
url = "http://localhost:31126/mcp"
enabled = false
