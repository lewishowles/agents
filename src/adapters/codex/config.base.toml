approval_policy = "never"
default_permissions = "project-edit"

[permissions.project-edit]
# Keep Codex's standard workspace safeguards unless a narrower rule overrides them.
extends = ":workspace"

[permissions.project-edit.workspace_roots]
# Give the shared configuration repositories the same access as the active workspace.
"{{HOME}}/Dev/Configuration/Agents" = true
"{{HOME}}/Dev/Configuration/zsh" = true
"{{HOME}}/Dev/Repositories/Packages/dev-tools" = true
"{{HOME}}/.Trash" = true
"{{HOME}}/.cache" = true
"{{HOME}}/.agents" = true
# HCOM keeps its shared message database here, and every hcom command needs write access to it.
"{{HOME}}/.hcom" = true
# Swift and Xcode builds write package caches, package security records, and build output here.
"{{HOME}}/Library/Caches/org.swift.swiftpm" = true
"{{HOME}}/Library/org.swift.swiftpm" = true
"{{HOME}}/Library/Developer/Xcode/DerivedData" = true
"/tmp" = true
"/private/tmp" = true

[permissions.project-edit.filesystem.":workspace_roots"]
# Let Git-backed setup tools store their repository ID without opening the rest of .git.
".git/config" = "write"
".git/config.lock" = "write"

[permissions.project-edit.network]
# Match the previous workspace sandbox's network access.
enabled = true

[features]
hooks = true
default_mode_request_user_input = true

[tui]
status_line = ["run-state", "project-name", "used-tokens", "context-used", "five-hour-limit", "weekly-limit", "model-with-reasoning"]
status_line_use_colors = true
alternate_screen = "never"

[mcp_servers.codebase-memory-mcp]
startup_timeout_sec = 60
required = true
command = "codebase-memory-mcp"
default_tools_approval_mode = "approve"

[mcp_servers.serena]
startup_timeout_sec = 60
required = true
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
default_tools_approval_mode = "approve"

[mcp_servers.mdn]
url = "https://mcp.mdn.mozilla.net/"
enabled = false

[mcp_servers.sketch]
url = "http://localhost:31126/mcp"
enabled = false
